# pocknix: let systemd-oomd act on the user session instead of the kernel OOM killer.
# With an 11 GB zram swap on 12 GB of RAM the RP5 can swap itself into a total stall before
# anything is killed (2026-10-06: two Steam installs unpacking at once froze the device; ping
# answered, nothing else did). oomd kills the worst cgroup under the session once memory
# pressure stays high. Same shape as Fedora's defaults (user@.service: pressure kill at 50 %).
[Service]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
