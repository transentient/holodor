# Never give up on known Wi-Fi. NetworkManager's default of 4 autoconnect
# retries strands the device offline after a flaky suspend/resume (the
# post-resume "sulk"): once the retries are burned, NM sits "disconnected"
# forever and the user has to reconnect by hand. 0 = retry indefinitely.
[connection]
connection.autoconnect-retries=0
