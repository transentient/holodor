# holodor — plymouth boot splash config.
# Theme = the Holodor cutscene (pocknix-boot-art, a plymouth `script` theme):
# ssalmon_px's 34-frame intro plays once at 10fps, then holds the logo until
# plymouth-quit hands tty1 to the session. ShowDelay=0: with no initramfs the
# splash already starts "late" (sysinit, ~2.5s); don't add the default 5s
# hide-short-boots delay on top or it would never show. DeviceTimeout caps how
# long plymouthd waits for the DRM device before falling back, so a display
# problem can't wedge boot. DeviceScale=1 (was 2 for the never-shipped spinner
# plan): the theme's frames are pre-scaled to 1920x1080 and drawn 1:1 — HiDPI
# scaling on top would double-scale them.
[Daemon]
Theme=holodor
ShowDelay=0
DeviceTimeout=8
DeviceScale=1
