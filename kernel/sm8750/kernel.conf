# kernel/sm8750/kernel.conf — per-SoC kernel source pins. POSIX sh, sourced by
# scripts/lib.sh after the device profile (which sets SOC and thereby selects
# this file). Bumping this SoC's kernel never touches another SoC's tree.
#
# Stock kernel.org source, pinned — same base ROCKNIX uses for SM8750
# (projects/ROCKNIX/packages/linux/package.mk: case SM8750 -> 7.1.3). The full
# kernel is this stock source + the patch stack under kernel/sm8750/patches/
# (applied in numeric subdir order: 10-mainline -> 20-sm8750 -> 30-version) +
# the config. sha256 verified against kernel.org sha256sums.asc 2026-07-28.
: "${KERNEL_VERSION:=7.1.3}"
: "${KERNEL_SOURCE_URL:=https://www.kernel.org/pub/linux/kernel/v${KERNEL_VERSION%%.*}.x/linux-${KERNEL_VERSION}.tar.xz}"
: "${KERNEL_SOURCE_SHA256:=be41c068e88f5242a19bccdbffbe077b18c47b45f627e2325504b4fab79dd1dc}"

# ROCKNIX's version-specific patch dir is still named "7.0" for the 7.1.x series
# (package.mk: PKG_PATCH_DIRS+=" 7.0") - not derivable from KERNEL_VERSION.
: "${ROCKNIX_VERSION_PATCH_DIR:=7.0}"

# The ROCKNIX device dir this tree is synced from (scripts/sync.sh):
# ${ROCKNIX_PROJECT_DIR}/devices/${ROCKNIX_SOC}. ROCKNIX names its device dirs
# in uppercase; our SOC key is lowercase (it names kernel/<soc>/ and
# vendor/rocknix-<soc>/). SM8750 enablement lives on ROCKNIX `next` (34
# patches incl. the AYN Odin3 DTS, Adreno 830 catalog, WCN7860 wifi/bt).
: "${ROCKNIX_SOC:=SM8750}"
