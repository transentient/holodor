# config/tuning/sm8750.conf — per-SoC userspace compiler tuning. POSIX sh,
# sourced by scripts/lib.sh right after kernel/${SOC}/kernel.conf; consumed by
# build-packages.sh, which passes the values into makepkg's environment for the
# tuned PKGBUILDs (mesa, gamescope, mangohud, fex-emu).
#
# ROCKNIX's exact SM8750 userspace flags (projects/ROCKNIX/devices/SM8750/
# options: TARGET_CPU=cortex-x4, TARGET_CPU_FLAGS=+fp16+crypto+i8mm+bf16
# +memtag+sm4+sha3+nosve+nosve2). The Odin 3's Snapdragon 8 Elite runs
# Oryon cores; ROCKNIX targets them via the cortex-x4 model — keep parity
# with ROCKNIX rather than guessing at an -mcpu=oryon-1 that gcc may not know.
: "${POCKNIX_TUNE_CFLAGS:=-march=armv9-a+fp16+crypto+i8mm+bf16+memtag+sm4+sha3+nosve+nosve2 -mtune=cortex-x4 -mno-outline-atomics}"

# FEX engine tuning. ROCKNIX deliberately remaps cortex-x3|cortex-x4 DOWN to
# cortex-a78 for the FEX build (fex-emu package.mk): the JIT output is
# runtime-tuned to the real CPU regardless, so tuning the engine to the
# armv9 prime buys nothing and risks armv9 host-tool SIGILLs.
: "${POCKNIX_FEX_TUNE_CPU:=cortex-a78}"
