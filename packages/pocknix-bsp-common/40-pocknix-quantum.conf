# Floor the PipeWire graph quantum at 256 frames (5.3 ms at 48 kHz).
# A game's audio stream (Source engine through winepulse: 128-frame quantum = 2.7 ms) drives
# the whole graph down to its own size; under game load the ALSA sink then underruns and the
# speakers crackle/distort (Odin 3, Portal 2 / No Man's Sky, 2026-10-08; Cliff: distorted at
# 128, "sounds okay" at 1024). 256 keeps latency under 6 ms for rhythm games; the per-game
# Audio Buffer tweak in Pocknix Control raises it further for games that need it.
context.properties = {
    default.clock.min-quantum = 256
}
