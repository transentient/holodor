# Power button contract (three layers — keep in sync with pocknix-powerd):
#   short press (<=0.8s)  -> suspend   (pocknix-powerd daemon, overlay)
#   long press  (>=5s)    -> poweroff  (pocknix-powerd too, since 2026-10-11: it checks the PMIC's
#                                        real-time key status at the 5 s mark before powering off)
#   press while asleep    -> wake      (PMIC wakeup source; kernel)
# HandlePowerKey stays 'ignore': systemd's default (poweroff) shut the device DOWN on a
# wake-press — the RP6 delivers the waking KEY_POWER to userspace after resume. That same
# delivery is why short-press-suspend lives in pocknix-powerd (which debounces after
# resume) and NOT here: logind has no resume holdoff for the power key, so
# HandlePowerKey=suspend would re-suspend on every wake press.
# HandlePowerKeyLongPress is 'ignore' too (was poweroff until bsp-common 30): on 2026-10-10 a
# docked, idle RP5 suspended, woke on its own 20 s later and logind saw a KEY_POWER held for
# 5 s with nobody in the room -> "Power key pressed long" -> poweroff. logind only counts
# seconds; pocknix-powerd asks the PMIC whether the button is physically down.
# (See docs/sm8550-suspend-wake-report.md and docs/plan-2026-10-11-rp5-dock-and-quality.md.)
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
