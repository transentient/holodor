# pocknix: a handheld on a dock has two interfaces on the same LAN (wifi + the dock's USB ethernet).
# Linux by default answers ARP for ANY local address on ANY interface, so when a LAN host asks "who has
# <the wifi address>", the dock's ethernet port answers too. NetworkManager's address-conflict detection
# on wlan0 then sees its own address claimed by another MAC ("conflict detected for IP address
# 192.168.1.68 with host <dock NIC MAC>", RP5 2026-10-14 23:43:35), withdraws the wlan0 subnet route,
# and once the dock is unplugged the device is unreachable on the LAN over wifi (default route only).
# The classic multi-homed fix: each interface answers ARP only for the addresses it carries, and
# sources its ARP requests from the address on that interface.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.default.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.default.arp_announce = 2
