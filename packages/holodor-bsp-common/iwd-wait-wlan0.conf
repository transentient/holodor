# iwd deletes and recreates the driver's default wlan0; started before that netdev
# registers, its NEW_INTERFACE races the kernel's (ENFILE) and wifi is dead all boot.
# (ported from pocknix-os 696119c — wifi-sulk family)
[Unit]
Wants=sys-subsystem-net-devices-wlan0.device
After=sys-subsystem-net-devices-wlan0.device
