# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
# InputPlumber composite device for the SM8550 family gamepad (RSInput MCU).
#
# ONE config serves every board in the family — Retroid Pocket Nova, Retroid Pocket 6
# (+TOP-DPAD), AYN Odin 2 / Mini / Portal — they all use the in-kernel RSInput driver
# (phys "rsinput-gamepad/input0") with the paddles + volume-up rocker on a separate
# gpio-keys node, and the same capability_map fixes the same driver quirks (A/B swap,
# explicit d-pad, Guide/QuickAccess). Gated on the devicetree model so the config only
# activates on family hardware.
#
# Target = `deck-uhid` (Steam Deck controller over uhid, IP >= 0.77) so Steam Input gets
# a first-class Steam-native pad AND InputPlumber survives suspend.
version: 1
kind: CompositeDevice
name: SM8550 family (RSInput) [holodor]

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Retroid Pocket Nova
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Retroid Pocket 6
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Retroid Pocket 6 TOP-DPAD
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYN Odin 2
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYN Odin 2 Mini
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYN Odin 2 Portal

single_source: false

source_devices:
  - group: gamepad
    evdev:
      phys_path: rsinput-gamepad/input0
      handler: event*
    capability_map_id: sm8550_gamepad

  # Back paddles (+ volume-up rocker) live here, not on the gamepad node.
  - group: gamepad
    evdev:
      name: gpio-keys
      phys_path: gpio-keys/input0
      handler: event*
    capability_map_id: sm8550_gamepad
  - group: gamepad
    evdev:
      name: gpio-keys-paddles
      phys_path: gpio-keys/input0
      handler: event*
    capability_map_id: sm8550_gamepad

options:
  auto_manage: true
  persist: true

target_devices:
  - deck-uhid
  - keyboard
