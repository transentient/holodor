# Use case configuration for SM8550 I2S (RP6 / AYN Odin 2 family)
# Author: Teguh Sobirin <teguh@sobir.in>

Include.pcm_split.File "/common/pcm/split.conf"

# A single active TX decimator arrives on channel 0 of MultiMedia3,
# expose the mics as mono sources through a 2-channel split PCM.
Macro [
	{
		SplitPCM {
			Name "sm8550_mono_in"
			Direction Capture
			Channels 1
			HWChannels 2
			HWChannelPos0 FL
			HWChannelPos1 FR
		}
	}
]

SectionVerb {
	EnableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
	]

	DisableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	Value {
		PlaybackPriority 150
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Headphones" {
	Comment "Headphones Playback"

	Include.wcdhpe.File "/codecs/wcd938x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd938x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "HP"
		PlaybackChannels 2
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	ConflictingDevice [
		"Headset"
	]

	# The SoundWire ports are only set up at hw_params, so drop and
	# reconnect the codec DMA backend to restart it with the new ports.
	EnableSequence [
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='DMIC7_MIXER Switch' 1"
		cset "name='DMIC6 Switch' 1"
		cset "name='TX SMIC MUX0' SWR_MIC10"
		cset "name='TX_DEC0 Volume' 84"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	# DEC0 is shared with the headset mic, only release the DMIC here
	DisableSequence [
		cset "name='DMIC6 Switch' 0"
		cset "name='DMIC7_MIXER Switch' 0"
	]

	Value {
		CapturePriority 100
		CaptureMixerElem "TX_DEC0"
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "sm8550_mono_in"
		Direction Capture
		Device 2
		HWChannels 2
		Channels 1
		Channel0 0
		ChannelPos0 MONO
	}
}

SectionDevice."Headset" {
	Comment "Headphone Microphone"

	ConflictingDevice [
		"Mic"
	]

	EnableSequence [
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='HDR12 MUX' NO_HDR12"
		cset "name='ADC2 MUX' INP2"
		cset "name='ADC2 Switch' 1"
		cset "name='TX1 MODE' ADC_NORMAL"
		cset "name='TX SMIC MUX0' SWR_MIC1"
		cset "name='TX_DEC0 Volume' 96"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	# DEC0 is shared with the internal mic, only release ADC2 here
	DisableSequence [
		cset "name='ADC2 Switch' 0"
		cset "name='ADC2_MIXER Switch' 0"
	]

	Value {
		CapturePriority 200
		CaptureMixerElem "ADC2"
		JackControl "Mic Jack"
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "sm8550_mono_in"
		Direction Capture
		Device 2
		HWChannels 2
		Channels 1
		Channel0 0
		ChannelPos0 MONO
	}
}

SectionDevice."HDMI" {
	Comment "DisplayPort playback"

	EnableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 1"
	]

	DisableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
		JackControl "DP0 Jack"
		JackHWMute "Speaker"
	}
}
