# pocknix (sm8550): WirePlumber audio rules for SM8550-RetroidPocket-I2S and AYN-Odin2.
#
# soft-mixer: the hardware gains are the vendor's fixed operating point, declared in the UCM
# device sequences (HiFi.conf: RX_RX0/1 Digital Volume = 84, HPHL/R Volume = 20,
# stream0.vol_ctrl0 MultiMedia1 Playback Volume = 14500); the slider is PipeWire's cubic
# software volume (50% = -18 dB, 100% = 0 dB).
monitor.alsa.rules = [
  {
    matches = [
      { alsa.card_name = "SM8550-RetroidPocket-I2S" }
      { alsa.card_name = "AYN-Odin2" }
      { device.name = "alsa_card.platform-sound" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer                 = true
        device.routes.default-sink-volume   = 0.125
        device.routes.default-sink-mute     = false
        device.routes.default-source-volume = 1.0
        device.routes.default-source-mute   = false
      }
    }
  }
]

# A route with no stored volume starts at 50% (0.5^3 = 0.125 = -18 dB) instead of
# WirePlumber's 40% (0.064 = -24 dB).
wireplumber.settings = {
  device.routes.default-sink-volume = 0.125
}
