# /usr/lib/pocknix/boards/rpnova.conf — runtime board facts: Retroid Pocket Nova.
# Selected by /usr/lib/pocknix/device.conf (DT model "Retroid Pocket Nova").
POCKNIX_DEVICE=rpnova
POCKNIX_SOC=sm8550

# Panel: il97680a,rpnova — native landscape 1280x960 (4:3) at 120Hz,
# NO rotation property in DT.
POCKNIX_PANEL_W=1280
POCKNIX_PANEL_H=960
POCKNIX_PANEL_REFRESH=120
POCKNIX_PANEL_ORIENT=normal
POCKNIX_ROTATION=none
POCKNIX_PANEL_MM=155x116         # 4:3 at ~210 DPI (matches Steam Deck 155mm horizontal width at 1280px)
POCKNIX_DESKTOP_ROTATE=none
POCKNIX_DESKTOP_SCALE=1.0

# CPU topology: big-core mask for emulator pinning (pocknix-play). SM8550:
# cpu0-2 A510 littles, cpu3-7 A710/A715 mids + X3 prime.
POCKNIX_BIG_CORES=3-7

# --- install-to-internal contract (qcom-abl) ----------------------------------
POCKNIX_INTERNAL_DISK=/dev/sda
POCKNIX_BOOT_GPT_NAME=ROCKNIX
POCKNIX_BOOT_FAT_LABEL=ROCKNIX
POCKNIX_ROOT_LABEL=HOLODOR_ROOT
