# Keep ALSA Speaker sink alive: WirePlumber's default 5s idle suspend tears down the
# Qualcomm DSP audio path, so the first sound after idle is swallowed (and the
# DSP can pop on wake).
# Speaker ONLY: applying session.suspend-timeout-seconds = 0 / node.always-process = true
# to Headphones pinned the MultiMedia2 PCM (hw:0,1) open at boot before the headphone jack
# route was active, causing subsequent headphone playback streams (pw-play) to hang.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*Speaker.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
