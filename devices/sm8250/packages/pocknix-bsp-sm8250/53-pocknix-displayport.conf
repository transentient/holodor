# pocknix: the DisplayPort (USB-C dock) sink on the RP5 sound card.
# With PipeWire's defaults (s24-32le, mmap) the first start of this sink makes the audio DSP time
# out on the DisplayPort AFE port ("AFE enable for port 0x6020 failed -110" in the kernel log) and
# the port is then stuck until a reboot. 16-bit, read/write access, 1024-frame periods start
# cleanly every time (measured 2026-10-07 through a UGREEN dock + HDMI capture). Which of the
# three matters was not bisected; raw aplay works with any of them.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_output.platform-sound.HiFi__DisplayPort__sink" } ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
        api.alsa.disable-mmap = true
        api.alsa.period-size = 1024
        api.alsa.headroom = 0
      }
    }
  }
]
