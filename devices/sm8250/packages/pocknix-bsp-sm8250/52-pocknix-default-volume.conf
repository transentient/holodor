# pocknix: never let the speaker route start at volume 0.
#
# 2026-09-28 on the RP5 (Visionox): first boot came up silent — the Speaker sink's route
# volume was 0.00 (wpctl) although pocknix-sm8250-audio-heal had planted the PA gains.
# WirePlumber initialises a route it has never seen from the mixer's CURRENT value; the heal
# service (which waits for the adsp) had not run yet, the PA controls read 0, and that 0 was
# then stored in default-routes and re-applied on every boot. With this rule a route without
# stored state starts at 1.0 (= 0 dB on the "Speakers" remap) instead of whatever the mixer
# happens to hold at that instant.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-sound" } ]
    actions = {
      update-props = {
        device.routes.default-sink-volume   = 1.0
        device.routes.default-sink-mute     = false
        device.routes.default-source-volume = 1.0
        device.routes.default-source-mute   = false
      }
    }
  }
]
