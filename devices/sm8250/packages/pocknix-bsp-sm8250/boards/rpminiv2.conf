# /usr/lib/pocknix/boards/rpminiv2.conf — runtime board facts: Retroid Pocket Mini V2.
# Selected by /usr/lib/pocknix/device.conf (DT model "Retroid Pocket Mini V2").
POCKNIX_DEVICE=rpminiv2
POCKNIX_SOC=sm8250

# Panel: ch13726a,rpminiv2 — native 1080x1240@60 portrait, DTS rotation=90 -> landscape 1240x1080.
POCKNIX_PANEL_W=1080
POCKNIX_PANEL_H=1240
