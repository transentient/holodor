# /usr/lib/pocknix/boards/rp5.conf — runtime board facts: Retroid Pocket 5.
# Selected by /usr/lib/pocknix/device.conf (DT model "Retroid Pocket 5").
POCKNIX_DEVICE=rp5
POCKNIX_SOC=sm8250

# Panel: CH13726A AMOLED, native 1080x1920@60 PORTRAIT, mounted rotation=270
# (DTS panel node) -> landscape, same transpose contract as the RP6: gamescope
# gets the NATIVE portrait mode + --force-orientation left (rotation shader).
POCKNIX_PANEL_W=1080
POCKNIX_PANEL_H=1920
POCKNIX_PANEL_REFRESH=60
POCKNIX_PANEL_ORIENT=left        # gamescope --force-orientation
POCKNIX_PANEL_MM=177x100         # DELIBERATE LIE (real panel: 68x121 portrait =
                                 # 121x68 landscape): this feeds gamescope's
                                 # GAMESCOPE_FAKE_OUTPUT_MM, and the true ~400dpi
                                 # size makes Steam's gamepadui scale WAY too big.
                                 # RP6's 177x100 gives the right UI size on the
                                 # same 1080x1920 panel (validated on device
                                 # 2026-07-13).
POCKNIX_DESKTOP_ROTATE=left      # kscreen-doctor rotation token
POCKNIX_DESKTOP_SCALE=2.5        # same panel res/size class as the RP6

# CPU topology: Snapdragon 865 = cpu0-3 A55 (little), cpu4-7 A77 (big).
# Consumed by pocknix-play's emulator core pinning (sm8550 devices are 3-7).
POCKNIX_BIG_CORES=4-7

# a650 turnip lacks storageBuffer8BitAccess (a7xx-only) -> every DXVK-3 tool rejects
# the GPU. Gates pocknix-proton-prep's DXVK-2.7 donor swap into downloaded Valve ARM
# Protons; the shipped cachy/GE tools are the -dxvk2 variants (dev/steam.md, DXVK-3 wall).
POCKNIX_GPU_DXVK3=no

# --- install-to-internal contract (arm-efi) -----------------------------------
# Recon'd on the RP5 2026-07-16: internal main LUN = /dev/sda (117GiB KIOXIA UFS,
# 4K logical sectors), Android GPT with userdata as the LAST partition (#23,
# ~107GiB) — the shrink-and-append flow applies unchanged. The boot chain
# (abl_a/b, boot_a/b, tz, ...) lives on the separate /dev/sde LUN and is never
# touched. BOOT_STYLE selects the arm-efi handling in the installer scripts
# (grub.cfg + fstab pinned to the internal PARTUUIDs at install time).
POCKNIX_BOOT_STYLE=qcom-abl
POCKNIX_INTERNAL_DISK=/dev/sda
POCKNIX_BOOT_GPT_NAME=ROCKNIX
POCKNIX_BOOT_FAT_LABEL=ROCKNIX
POCKNIX_ROOT_LABEL=POCKNIX_ROOT

# Game-mode refresh rate. The Visionox RP5 panel lists 120 Hz (preferred) and 60 Hz; the original RP5
# panel is 60 Hz only. gamescope (0008) offers both to Steam: menus run at 120 Hz and the panel
# switches live with the game's frame limit. PREFER_LOWEST makes a 60 fps limit run the panel at
# 60 Hz instead of every second refresh at 120 Hz. Measured on a Visionox unit 2026-10-05
# (tools/rp5-bench, Vampire Survivors): at 120 Hz with a 60 fps limit frames pace at 15.0 ms and slip
# every 5th frame (gamescope has to wake 6.4 ms before each 8.35 ms refresh: the rotation composite
# alone costs up to 4.7 ms); at 60 Hz every frame is on screen for exactly one refresh (16.73 ms).
# Uncapped at 120 Hz, games that cannot hold 120 slip a refresh every ~65 ms.
# POCKNIX_GAMESCOPE_REFRESH=60 here instead pins game mode to one rate (pocknix-steam passes -r).
POCKNIX_GAMESCOPE_REFRESH_PREFER_LOWEST=1
# No frame limit set: panel at 60 Hz (120 Hz only when a game's limit asks for it). gamescope 6.
POCKNIX_GAMESCOPE_REFRESH_DEFAULT_LOWEST=1
