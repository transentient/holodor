# Use case configuration for RetroidPocket 5 and Mini.
# Author: Teguh Sobirin <teguh@sobir.in>
# Ported verbatim from ROCKNIX alsa-ucm-conf patches/SM8250/0002 (see
# RetroidPocket.conf for provenance). Codec include sequences come from the
# base alsa-ucm-conf package (/codecs/wcd938x, /codecs/wsa881x,
# /codecs/qcom-lpass).

SectionVerb {

	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones Playback"

	Include.wcdhpe.File "/codecs/wcd938x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd938x/HeadphoneDisableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	# The rx-macro half is written out here instead of including the stock
	# rx-macro/HeadphoneEnableSeq.conf. Stock turns the RX compander ON while the
	# codec's HPH compander is OFF, and picks the class-H amp mode. Measured on the
	# RP5 2026-10-06 (UCA202 line-in, tools/rp5-audio): every loud passage ducked
	# the whole signal by 18 dB for its duration (the "warble"), and with the
	# compander off class-H distorted a full-scale tone by 16 %.
	# Companders off + class AB (as upstream's wcd938x/HeadphoneABEnableSeq.conf
	# does for laptops with this codec): no ducking, 0.01 % distortion at full
	# scale, left and right within 0.2 dB.
	EnableSequence [
		cset "name='RX_HPH PWR Mode' LOHIFI"
		cset "name='RX HPH Mode' CLS_AB"
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_MACRO RX1 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT1_1 MIX1 INP0' RX1"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX_COMP1 Switch' 0"
		cset "name='RX_COMP2 Switch' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "HP"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker Playback"

	Include.wsamspke.File "/codecs/qcom-lpass/wsa-macro/SpeakerEnableSeq.conf"
	Include.wsamspkd.File "/codecs/qcom-lpass/wsa-macro/SpeakerDisableSeq.conf"
	Include.wsaspke.File "/codecs/wsa881x/SpeakerEnableSeq.conf"
	Include.wsaspkd.File "/codecs/wsa881x/SpeakerDisableSeq.conf"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixer "default:${CardId}"
		# No PlaybackMixerElem: the Speaker sink uses SOFTWARE volume, like the Odin 3 (bsp 20, 2026-09-29).
		# The hardware stages are FIXED by pocknix-sm8250-audio-heal (WSA digital 124, PA 10) and the loudness
		# chain runs at unity. Slider->PA (0..+18 dB) sat crushed at the loud end; slider->digital (-84..+40 dB)
		# was silent below ~20 % and too loud at 100 %. Steam's curve on top of a fixed ceiling is what works.
	}
}

SectionDevice."Headset" {
	Comment "Headphone Microphone"

	Include.wcdmice.File "/codecs/wcd938x/HeadphoneMicEnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd938x/HeadphoneMicDisableSeq.conf"
	Include.txmhpe.File "/codecs/qcom-lpass/tx-macro/HeadphoneMicEnableSeq.conf"
	Include.txmhpd.File "/codecs/qcom-lpass/tx-macro/HeadphoneMicDisableSeq.conf"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC2"
		JackControl "Mic Jack"
	}
}
