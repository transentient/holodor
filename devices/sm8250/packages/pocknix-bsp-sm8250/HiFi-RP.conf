# HiFi-RP.conf - Retroid Pocket 5 / Flip 2 / Mini HiFi verb (pocknix-bsp-sm8250 42, 2026-10-15).
#
# Upstream alsa-ucm-conf codec sequences (the image ships 1.2.14) plus the vendor's operating point
# from the RP5's Android HAL (mixer_paths_qrd.xml): speakers at WSA digital 102 with the wsa-macro
# companders OFF (linear, see the Speaker device) and the amp COMP/BOOST on; headphones at RX digital
# 84 (0 dB), HPHL/R 20, class AB, ULP power mode, all four companders OFF (see the Headphones device:
# upstream's class H ULP clips the HPH output at ~80 mV on this device, UCA202-measured 2026-10-15).
# Every control a device depends on is written INLINE: alsa-ucm appends an Include'd EnableSequence
# AFTER the section's own csets, so an include can silently override them (it did, on 40/41), and
# WirePlumber re-runs the sequences on every re-parse, so they must be idempotent. Measured against
# the Android reference (tone -8.6 dBFS at max): see docs/audio-architecture-rp5-2026-10-15.md.
SectionVerb {
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]
	DisableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones Playback"
	Include.wcdhpd.File "/codecs/wcd938x/HeadphoneDisableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"
	# The enable sequence is written out (inherited from upstream rx-macro + wcd938x HeadphoneEnableSeq.conf,
	# alsa-ucm-conf 1.2.14) instead of Include'd: alsa-ucm runs an included EnableSequence AFTER the csets
	# below, so on 40/41 the include's HPH_COMP 0 and CLS_H_ULP won over ours. Changes vs upstream, all
	# UCA202-measured on the jack 2026-10-15 (tools/dock/results-rp5-2026-10-15.md, scratchpad jack-matrix.sh):
	#   RX HPH Mode CLS_AB: upstream's CLS_H_ULP clips the HPH output at ~80 mV on this device (full-scale
	#     tone -28 dBFS with 25 % H3, a loud burst ducks a quiet probe 24 dB); CLS_AB = -9.6 dBFS, 0.03 % THD.
	#   RX_HPH PWR Mode ULP: LOHIFI compresses a -1 dBFS burst 5 dB even with the companders off.
	#   All four companders OFF (the 2026-10-06 recipe): RX_COMP on + HPH_COMP off ducks loud passages 18-24 dB.
	#   RX digital 84 = 0 dB on the S16 path (kernel 30+); HPHL/R 20 = 0 dB, then the "HP" mixer mapping
	#     drives HPHL/R from the slider (-30 dB at 25 %, -12 dB at 50 %, +6 dB at 100 %).
	EnableSequence [
		cset "name='RX_HPH PWR Mode' ULP"
		cset "name='RX HPH Mode' CLS_AB"
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_MACRO RX1 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT1_1 MIX1 INP0' RX1"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX_COMP1 Switch' 0"
		cset "name='RX_COMP2 Switch' 0"
		cset "name='HPHL_RDAC Switch' 1"
		cset "name='HPHR_RDAC Switch' 1"
		cset "name='HPHL Switch' 1"
		cset "name='HPHR Switch' 1"
		cset "name='HPHL_COMP Switch' 0"
		cset "name='HPHR_COMP Switch' 0"
		cset "name='CLSH Switch' 1"
		cset "name='LO Switch' 1"
		cset "name='RX_RX0 Digital Volume' 84"
		cset "name='RX_RX1 Digital Volume' 84"
		cset "name='HPHL Volume' 20"
		cset "name='HPHR Volume' 20"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "HP"
		PlaybackChannels 2
		PlaybackRate 48000
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker Playback"
	# Routing as upstream wsa-macro/SpeakerEnableSeq + wsa881x/SpeakerEnableSeq, written out so the order is
	# explicit. LINEAR CHAIN (Cliff, 2026-10-15 14:35): the wsa-macro companders OFF. Measured on the NTG with
	# the companders ON (upstream driver defaults): +12 dB of makeup gain in the normal range, then an 8 dB drop
	# at slider 0.8 and 12 dB of pumping at 1.0 (the upstream compander is not tuned like the vendor's, which
	# reaches -8.6 dBFS with -0.3 dB pumping). OFF: linear, +7.7 dB for +7.5 dB of slider, no pumping below
	# clipping. Digital 102 (+18 dB): the 1 kHz tone from a -20 dBFS file reads -13.4 dBFS at 100 % (Android
	# max -8.6), about -31 dBFS at 50 %; full-scale content clips in the top of the range (no limiter in the
	# chain until the vendor's compander tuning is read from Android). PA 12, boost 8.5 V (kernel default).
	EnableSequence [
		cset "name='WSA RX0 MUX' AIF1_PB"
		cset "name='WSA RX1 MUX' AIF1_PB"
		cset "name='WSA_RX0 INP0' RX0"
		cset "name='WSA_RX1 INP0' RX1"
		cset "name='WSA_COMP1 Switch' 0"
		cset "name='WSA_COMP2 Switch' 0"
		cset "name='WSA_RX0 Digital Volume' 102"
		cset "name='WSA_RX1 Digital Volume' 102"
		cset "name='SpkrLeft COMP Switch' 1"
		cset "name='SpkrLeft BOOST Switch' 1"
		cset "name='SpkrLeft DAC Switch' 1"
		cset "name='SpkrLeft VISENSE Switch' 0"
		cset "name='SpkrLeft PA Volume' 12"
		cset "name='SpkrRight COMP Switch' 1"
		cset "name='SpkrRight BOOST Switch' 1"
		cset "name='SpkrRight DAC Switch' 1"
		cset "name='SpkrRight VISENSE Switch' 0"
		cset "name='SpkrRight PA Volume' 12"
	]
	DisableSequence [
		cset "name='SpkrLeft COMP Switch' 0"
		cset "name='SpkrLeft BOOST Switch' 0"
		cset "name='SpkrLeft DAC Switch' 0"
		cset "name='SpkrLeft VISENSE Switch' 0"
		cset "name='SpkrRight COMP Switch' 0"
		cset "name='SpkrRight BOOST Switch' 0"
		cset "name='SpkrRight DAC Switch' 0"
		cset "name='SpkrRight VISENSE Switch' 0"
		cset "name='WSA_RX0 INP0' ZERO"
		cset "name='WSA_RX1 INP0' ZERO"
		cset "name='WSA RX0 MUX' ZERO"
		cset "name='WSA RX1 MUX' ZERO"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixer "default:${CardId}"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Headset" {
	Comment "Headphone Microphone"
	Include.wcdmice.File "/codecs/wcd938x/HeadphoneMicEnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd938x/HeadphoneMicDisableSeq.conf"
	Include.txmhpe.File "/codecs/qcom-lpass/tx-macro/HeadphoneMicEnableSeq.conf"
	Include.txmhpd.File "/codecs/qcom-lpass/tx-macro/HeadphoneMicDisableSeq.conf"
	EnableSequence [
		cset "name='ADC2 Volume' 10"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC2"
		CaptureChannels 2
		CaptureRate 48000
		JackControl "Mic Jack"
	}
}
