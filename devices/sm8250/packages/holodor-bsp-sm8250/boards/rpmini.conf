# /usr/lib/pocknix/boards/rpmini.conf — runtime board facts: Retroid Pocket Mini.
# Selected by /usr/lib/pocknix/device.conf (DT model "Retroid Pocket Mini").
POCKNIX_DEVICE=rpmini
POCKNIX_SOC=sm8250

# Panel: ch13726a,rpmini — native 960x1280@60 portrait, DTS rotation=90 -> landscape 1280x960.
POCKNIX_PANEL_W=960
POCKNIX_PANEL_H=1280
POCKNIX_PANEL_REFRESH=60
POCKNIX_PANEL_ORIENT=right
POCKNIX_PANEL_MM=155x116
POCKNIX_DESKTOP_ROTATE=right
POCKNIX_DESKTOP_SCALE=1.25

POCKNIX_BIG_CORES=4-7
POCKNIX_GPU_MIN_FREQ=490000000
POCKNIX_GPU_DXVK3=no

POCKNIX_BOOT_STYLE=qcom-abl
POCKNIX_INTERNAL_DISK=/dev/sda
POCKNIX_BOOT_GPT_NAME=ROCKNIX
POCKNIX_BOOT_FAT_LABEL=ROCKNIX
POCKNIX_ROOT_LABEL=POCKNIX_ROOT
