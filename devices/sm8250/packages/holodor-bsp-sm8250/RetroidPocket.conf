# ALSA UCM master config for the Retroid Pocket sm8250 sound card (DTS model "RetroidPocket":
# WSA881x speaker amps + WCD9385 codec on sm8250-sndcard; RP5, Flip 2, Mini, Mini V2).
#
# Skeleton from ROCKNIX alsa-ucm-conf patches/SM8250/0002 + 0004 (Teguh Sobirin); the same files ship in
# Armada. HOLODOR 2026-10-15 (pocknix-bsp-sm8250 40): the hardware operating point is the vendor's own
# (RP5 Android HAL mixer_paths_qrd.xml, pulled from the device 2026-10-12) and lives in the device
# sequences of HiFi-RP.conf, not in scripts; see docs/audio-architecture-rp5-2026-10-15.md.
# Nothing on this image runs the BootSequence (no `alsaucm boot`), so every gain is declared in the
# device EnableSequences, which WirePlumber re-runs at every card (re)creation.
Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/sm8250/HiFi-RP.conf"
	Comment "HiFi quality Music."
}

# Dock audio = its own verb = its own PipeWire profile, so a DisplayPort PCM that cannot start can only
# take THIS profile down (PipeWire probes every device of a profile once, at card creation). With a
# Priority above HiFi's, WirePlumber selects it by itself when the DP0 Jack reports a sink and returns
# to HiFi when the sink is gone. No switching script.
SectionUseCase."HDMI" {
	File "/Qualcomm/sm8250/HDMI-RP.conf"
	Comment "DisplayPort / HDMI dock audio"
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd938x/init.conf"
