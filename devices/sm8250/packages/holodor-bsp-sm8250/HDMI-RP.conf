# HDMI-RP.conf — Retroid Pocket 5 / Flip 2 "HDMI" verb: audio over the USB-C dock's DisplayPort
# (pocknix-bsp-sm8250 39, 2026-10-14; 40: verb Priority, no switcher, no priming).
#
# Why a verb of its own and not a device inside HiFi: PipeWire's ACP probes every device of a
# profile when it creates the card (open + hw_params) and marks the WHOLE profile unsupported when
# one fails (acp/alsa-mixer.c pa_alsa_profile_set_probe: p->supported = false). With the DisplayPort
# device inside HiFi, an undocked boot lost Speaker and Headphones twice (bsp 27 -> 28, bsp 36 -> 37).
# In its own verb the DP device can only ever take the HDMI profile down. ROCKNIX ships dock audio
# the same way (an "HDMI" profile selected by its output monitor on hotplug); pocknix-dp-audio-switch
# does that here: wpctl set-profile HDMI when card0-DP-1 reports connected, HiFi when it goes away.
# Armada 20260927 ships the same split for the RP5 (RetroidPocket.conf: HiFi + HDMI use cases,
# HDMI-RP.conf = verb-level DISPLAY_PORT_RX route, device hw:0,3 / 48 kHz / 2 ch / DP0 Jack).
#
# Front-end PCM MultiMedia4 = hw:0,3 (MultiMedia3 is the headset-mic capture), back-end
# DISPLAY_PORT_RX (AFE port 0x6020). Jack control "DP0 Jack" (hdmi-audio-codec, SND_JACK_AVOUT).
# The verb carries no speaker/headphone state: switching to it runs HiFi's device DisableSequences
# (speaker amps off) and switching back runs their EnableSequences again (idempotent since bsp 36).
# WirePlumber: 53-pocknix-displayport.conf pins the sink to S16LE 48 kHz, no mmap (the DSP port
# starts reliably with that; measured 2026-10-07).

SectionVerb {
	EnableSequence [
		cset "name='DISPLAY_PORT_RX Audio Mixer MultiMedia4' 1"
	]

	DisableSequence [
		cset "name='DISPLAY_PORT_RX Audio Mixer MultiMedia4' 0"
	]

	Value {
		TQ "HiFi"
			# PipeWire ACP: profile priority = this + the devices' PlaybackPriority (HiFi = 8000 + 400).
		# Above HiFi so that WirePlumber picks this profile by itself whenever the DP0 Jack says a sink
		# is present (availability "yes") and drops back to HiFi when it is gone. No switcher.
		Priority 9000
	}
}

SectionDevice."DisplayPort" {
	Comment "DisplayPort / HDMI (USB-C dock)"

	EnableSequence [
		cset "name='DISPLAY_PORT_RX Audio Mixer MultiMedia4' 1"
	]

	DisableSequence [
		cset "name='DISPLAY_PORT_RX Audio Mixer MultiMedia4' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},3"
		PlaybackChannels 2
		PlaybackRate 48000
		JackControl "DP0 Jack"
	}
}
