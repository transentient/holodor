# pocknix (sm8250, Retroid Pocket card): the two WirePlumber settings this card needs. Everything else
# is upstream policy: the UCM verbs are the profiles (HiFi, HDMI with a higher Priority), the jacks
# drive availability, WirePlumber picks the profile and the default sink.
#
# soft-mixer: the hardware gains are the vendor's fixed operating point, declared in the UCM device
# sequences (HiFi-RP.conf); the slider is PipeWire's software volume (cubic: 50 % = -18 dB). 100 % is
# the vendor's maximum. PipeWire's hardware-volume mapping would instead treat 0 dB of the digital
# volume control as 100 % and lose the vendor's +12 dB.
monitor.alsa.rules = [
  {
    matches = [ { alsa.card_name = "RetroidPocket" } ]
    actions = { update-props = { api.alsa.soft-mixer = true } }
  }
]
# A route with no stored volume starts at 50 % (0.5^3 = 0.125) instead of WirePlumber's 40 %
# (0.064 = -24 dB): first boot, a dock, headphones.
wireplumber.settings = {
  device.routes.default-sink-volume = 0.125
}
