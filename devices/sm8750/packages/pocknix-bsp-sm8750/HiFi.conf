# Use case configuration for AYN SM8750
# Author: Teguh Sobirin <teguh@sobir.in>

SectionVerb {
	# ORDER MATTERS (hw-proven 2026-08-13): writing 0 to ANY FE route on a
	# backend resets that BE's mixer and silently drops its other FE routes
	# (q6apm side effect). The MultiMedia2 clear must run FIRST — with it
	# last (or after the MM1 set) every boot came up silent because it
	# wiped the just-set MM1 speaker route.
	EnableSequence [
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia2' 0"
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	Include.wcde.File "/codecs/wcd939x/DefaultEnableSeq.conf"

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	# Own the speaker routing at device level: UCM device transitions (e.g.
	# the always-available Headphones route activating) can drop the
	# verb-level cset, leaving total silence. Verified 2026-08-13.
	EnableSequence [
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones playback"

	# The DSP routes each FE stream to ONE backend: if the MI2S (speaker)
	# fanout for MultiMedia2 is on (stray alsa-state), the codec BE starves
	# and "Headphones" plays from the speakers. Verified on hardware
	# 2026-08-13: clearing it puts the stream on the jack.
	# The MM1 re-assert compensates the q6apm BE reset (see verb comment):
	# the MM2 clear drops MM1 as a side effect, which would kill the
	# Speaker sink whenever the Headphones route activates.
	EnableSequence [
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia2' 0"
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
	]

	Include.wcdhpe.File "/codecs/wcd939x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd939x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	Value {
		PlaybackChannels 2
		# Jack detect (MBHC) fires since kernel-26 (patches 0603/0604; verified on
		# the device 2026-09-23: the 'Headphone Jack' switch flips on plug), so the
		# jack gates this sink: available + preferred while plugged, the speaker
		# hardware-muted meanwhile, back to the speaker on unplug.
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixer "default:${CardId}"
		# "HP" = the stereo remap of 'HPHL Volume'/'HPHR Volume' (wcd939x PA gain; defined
		# in the base codecs/wcd939x/init.conf and again in AYN-Odin3.conf), the same
		# element Qualcomm's x1e80100/sc8280xp UCMs bind. Through pkgrel 18 this said
		# "HP Digital", copied from Qualcomm/sm8750/MTP: no such control exists on this
		# card, so PipeWire found no hardware volume and attenuated in SOFTWARE on top of
		# a max-gain analog path (HPHL/HPHR 20 = register 0) -> the hiss at 40 %. Now the
		# sink slider drives the PA gain with the digital path at 0 dB (RX_RX0/1 84).
		# Caveat (agenda E): the kernel's HPH TLV is bogus (0.07 dB/step), so amixer dB
		# readouts for HPHL/HPHR mean nothing — judge by register step and by ear; if
		# PipeWire's dB mapping makes the slider useless, fall back to the BootSequence
		# ladder in docs/headphone-ucm-checklist-2026-09-24.md (pkgrel 19, 2026-09-24).
		PlaybackMixerElem "HP"
	}
}

