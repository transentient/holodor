# /usr/lib/pocknix/boards/odin3.conf — runtime board facts: AYN Odin 3.
# Selected by /usr/lib/pocknix/device.conf (DT model "AYN Odin 3" — string
# read live off the device's /proc/device-tree/model, 2026-07-28).
POCKNIX_DEVICE=odin3
POCKNIX_SOC=sm8750

# Panel: native 1080x1920 portrait; Armada runs gamescope with
# `-W 1080 -H 1920 --force-orientation right --use-rotation-shader` on this
# exact unit (read from the live process list), so the orientation token is
# right — VERIFIED, not inferred. Refresh: panel is spec'd 120Hz; Armada does
# not force a rate. Start at 120 and drop to 60 if mode-set misbehaves.
POCKNIX_PANEL_W=1080
POCKNIX_PANEL_H=1920
POCKNIX_PANEL_REFRESH=60
POCKNIX_PANEL_ORIENT=right       # gamescope --force-orientation (Armada-verified)
POCKNIX_PANEL_MM=177x100         # same fake as the family: uniform ~275dpi UI
POCKNIX_DESKTOP_ROTATE=right
POCKNIX_DESKTOP_SCALE=2.5        # RP6 starting value; tune on device

# CPU topology: Snapdragon 8 Elite = 8x Oryon (no LITTLE cluster). ROCKNIX
# pins IRQs to cpu0-1 (irqaffinity=0-1), so use 2-7 for emulator pinning.
# TODO VERIFY on device: cpufreq max per core (prime cores may be 6-7).
POCKNIX_BIG_CORES=2-7

# --- install-to-internal contract (qcom-abl) ----------------------------------
# TODO VERIFY before any internal install: on the running device the SD is
# /dev/mmcblk0 and internal UFS should be /dev/sda — confirm with lsblk first.
POCKNIX_INTERNAL_DISK=/dev/sda
POCKNIX_BOOT_GPT_NAME=ROCKNIX
POCKNIX_BOOT_FAT_LABEL=ROCKNIX
POCKNIX_ROOT_LABEL=HOLODOR_ROOT
