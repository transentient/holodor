# Keep ALSA sinks alive: WirePlumber's default 5s idle suspend tears down the
# Qualcomm DSP audio path, so the first sound after idle is swallowed (and the
# DSP can pop on wake).  Same fix as SteamOS-adjacent distros use on this hw.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
