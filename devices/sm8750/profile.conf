# devices/sm8750/profile.conf — build-time profile: the SM8750 FAMILY image.
#
# Same shape as devices/sm8550: one image per SoC, runtime board selection by
# /proc/device-tree/model. Sole board so far: AYN Odin 3 (model string
# "AYN Odin 3" — read off the running device 2026-07-28). ROCKNIX SM8750 also
# targets the Retroid Pocket 6 successor family later; add boards as they land.
#
# POSIX sh, sourced by scripts/lib.sh right after config/pocknix.conf; override
# any value from the environment as usual.

DEVICE_PRETTY="SM8750 family (AYN Odin 3)"
DEVICE_HOSTNAME="holodor"     # substituted for @DEVICENAME@ in the kernel config
: "${SOC:=sm8750}"            # selects kernel/${SOC}/ and vendor/rocknix-${SOC}/

# --- qcom-abl boot contract (what the ROCKNIX-flashed ABL expects) -------------
# Identical contract to sm8550: GPT p1 FAT32 labelled ROCKNIX containing
# KERNEL + KERNEL.md5 (Android boot image with appended DTBs; the ABL picks the
# DTB by the "set device model" menu), GPT p2 ext4 root. Verified live on the
# Odin 3 during the Armada SD-boot work (RUNBOOK-armada-sdboot.md).
: "${BOOTLOADER:=qcom-abl}"
: "${SD_FAT_LABEL:=ROCKNIX}"
: "${SD_BOOT_PARTNAME:=system}"
: "${ROOT_LABEL:=HOLODOR_ROOT}"

# --- kernel command line ------------------------------------------------------
# Base = ROCKNIX SM8750 EXTRA_CMDLINE (devices/SM8750/options):
#   rootwait quiet video=efifb:off console=tty0 irqaffinity=0-1
#   cgroup.memory=nokmem,nosocket nosoftlockup
# plus, deliberately:
#   allow_mismatched_32bit_el0  — Armada ships it on this device; required for
#                                 32-bit x86 titles under FEX on cores with
#                                 mixed AArch32 support (harmless otherwise)
#   mem_sleep_default=s2idle    — s2idle sleeps DEEPER than "deep" on this SoC (31mA vs 160mA+): the RPMh sleep-set flush only runs on the cpuidle path. Validated 2026-08-31 (wake sources, mid-game, vol-up). "deep"=S3 verified 07-27 but never power-collapses the chip.
#   silent-boot set             — pocknix house style (splash/plymouth/status)
# NOT copied from Armada (Fedora-specific or unproven benefit): psi=1,
# swiotlb=8192, cpufreq.default_governor (config sets schedutil already),
# pcie_ports=compat, fw_devlink.strict=1 — revisit during stabilization if
# wifi/bt/panel probing misbehaves.
# root by PARTUUID, not PARTLABEL: an internal install carries the same
# ROOT_LABEL partlabel, and with an SD inserted the kernel mounts whichever
# probes first (UFS wins — the 2026-08-21 dry-run race). SD_ROOT_PARTUUID is
# the deterministic GUID build-sd-image.sh stamps on p2 of every image.
: "${KERNEL_CMDLINE_ROOT:=root=PARTUUID=${SD_ROOT_PARTUUID} rw}"
: "${KERNEL_CMDLINE_EXTRA:=quiet loglevel=3 systemd.show_status=false splash plymouth.ignore-serial-consoles rootwait console=tty0 fbcon=logo-pos:center video=efifb:off allow_mismatched_32bit_el0 irqaffinity=0-1 cgroup.memory=nokmem,nosocket nosoftlockup mem_sleep_default=s2idle fw_devlink.sync_state=timeout}"
: "${KERNEL_CMDLINE:=${KERNEL_CMDLINE_ROOT} ${KERNEL_CMDLINE_EXTRA}}"

# --- firmware source (within vendor/, populated by `make sync`) ---------------
: "${FW_SRC_REL:=rocknix-${SOC}/filesystem/usr/lib/kernel-overlays/base/lib/firmware}"

# --- device packages (built from devices/sm8750/packages/, installed by build-image)
: "${DEVICE_BSP_PKG:=pocknix-bsp-sm8750}"
: "${DEVICE_META_PKG:=pocknix-device-sm8750}"
: "${KERNEL_PKG:=linux-pocknix-${SOC}}"
